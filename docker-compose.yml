# Bounded container logs. Docker's default json-file driver never rotates, so
# a months-long run filled the disk with log lines -- and a full disk stops
# Postgres, which stops everything. 5 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:15-alpine
    container_name: trading_postgres_db
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${DB_MEM_LIMIT:-1g}
    environment:
      # So `docker compose exec db psql` renders timestamps in the same zone
      # the dashboard does. Storage is unchanged: timestamptz values are
      # absolute instants, and PGTZ/TZ only affect how they are displayed.
      TZ: ${APP_TIMEZONE:-America/New_York}
      PGTZ: ${APP_TIMEZONE:-America/New_York}
      POSTGRES_USER: postgres
      # REQUIRED -- no fallback. The old ":-secret" default meant a missing
      # .env line silently produced a database whose password is printed in
      # this public repository. Compose now refuses to start instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env -- see .env.example}
      POSTGRES_DB: memecoin_trading
    # LOOPBACK ONLY. "5432:5432" published Postgres on every interface: the LAN
    # here, and on a VPS the whole internet -- Docker-published ports are
    # written straight into iptables and BYPASS ufw, so a host firewall does
    # not cover them. Combined with the fallback password below, that was an
    # internet-facing trading database (the fallback is gone too). Host tools still reach it on
    # localhost:5432; the containers reach it on the compose network as `db`
    # and never used this mapping at all.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically executes schema.sql when the database initialization occurs
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memecoin_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:15-alpine
    restart: "no"
    logging: *default-logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env -- see .env.example}
    volumes:
      - ./migrate.sql:/migrations/migrate.sql:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --host=db
      - --username=postgres
      - --dbname=memecoin_trading
      - --file=/migrations/migrate.sql
  web:
    build: .
    container_name: trading_agent_network
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${WEB_MEM_LIMIT:-1536m}
    pids_limit: 512
    # Non-root image user (see Dockerfile) plus no privilege escalation and no
    # Linux capabilities: a web-facing Python process needs none of them.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Nothing in the app writes to its filesystem; /tmp is the only scratch.
    read_only: true
    tmpfs:
      - /tmp
    # Reports (unhealthy) in `docker compose ps` once the pipeline has not
    # STARTED a tick for HEALTH_MAX_TICK_AGE_S -- a dead worker and a hung one
    # both look like that. python, not curl: python:3.11-slim ships no curl.
    #
    # Plain Docker does NOT restart a container for being unhealthy --
    # `restart:` fires only when the process exits. RECOVERY is therefore done
    # in-process: main.py's watchdog thread exits the process (status 1) once
    # the heartbeat is WATCHDOG_EXIT_AFTER_S stale or a worker has died, and
    # the restart policy above brings it back. No autoheal sidecar: that would
    # need the Docker socket, which is root on the host.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    ports:
      # The public-facing route must terminate TLS at a reverse proxy. Keep
      # the app itself reachable only from the host so port 8000 cannot
      # bypass that proxy and expose the session over plain HTTP.
      - "127.0.0.1:8000:8000"
    environment:
      # Same required variable as the db service, so the two cannot drift.
      # Hex only (openssl rand -hex 24): characters like @ : / # would break
      # this URL.
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/memecoin_trading
      # Every database call is bounded (engine.db_connect, main._apg_*).
      - DB_CONNECT_TIMEOUT_S=${DB_CONNECT_TIMEOUT_S:-10}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-60000}
      - DB_IDLE_TX_TIMEOUT_MS=${DB_IDLE_TX_TIMEOUT_MS:-120000}
      # Self-recovery: exit (and let `restart:` bring the container back)
      # when no pipeline iteration has STARTED for this long, or when any
      # background worker has died. Longer than HEALTH_MAX_TICK_AGE_S, so a
      # stall shows as (unhealthy) before it is acted on.
      - WATCHDOG_EXIT_ENABLED=${WATCHDOG_EXIT_ENABLED:-true}
      - WATCHDOG_EXIT_AFTER_S=${WATCHDOG_EXIT_AFTER_S:-900}
      # Display timezone for the dashboard clock and log lines. Any IANA zone
      # name; America/New_York applies EDT/EST automatically, which a fixed
      # offset like "EST5" would not. Stored timestamps are unaffected --
      # every timestamp column is TIMESTAMP WITH TIME ZONE, so instants are
      # absolute and this only changes how they are rendered.
      - APP_TIMEZONE=${APP_TIMEZONE:-America/New_York}
      - TZ=${APP_TIMEZONE:-America/New_York}
      # Random, persistent secret used to sign session cookies. If unset, the
      # app generates a temporary one at startup (logged as a WARNING) and all
      # sessions/logins are invalidated on every restart.
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      # Set SESSION_COOKIE_INSECURE=1 in .env for local http://localhost
      # testing only -- the session cookie is Secure by default and a
      # Secure cookie is never sent over plain HTTP, so sign-in fails
      # silently without it. Never set it on a deployed host.
      - SESSION_COOKIE_INSECURE=${SESSION_COOKIE_INSECURE:-}
      - SESSION_MAX_AGE_SECONDS=${SESSION_MAX_AGE_SECONDS:-43200}
      # The one Gmail address allowed to sign in (feature 8). Simple
      # email-match login, not real Google OAuth -- see .env.example.
      - AUTHORIZED_GOOGLE_EMAIL=${AUTHORIZED_GOOGLE_EMAIL}
      # Real Solana market data (Stage 1 of DEX/wallet integration -- see
      # README.md). Required: comma-separated token mint addresses, no
      # default shipped on purpose -- see .env.example.
      # Empty is the normal case: token discovery supplies candidates.
      # The :- default stops compose warning on every command.
      - WATCHLIST_TOKEN_ADDRESSES=${WATCHLIST_TOKEN_ADDRESSES:-}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet.solana.com}
      # Header auth for a paid RPC. Use the plain hostname in
      # SOLANA_RPC_URL and put the credential here -- never a
      # path-style URL with the token embedded, which would be
      # echoed into logs and alert rows.
      - SOLANA_RPC_X_TOKEN=${SOLANA_RPC_X_TOKEN:-}
      - JUPITER_API_BASE=${JUPITER_API_BASE:-https://api.jup.ag}
      - DEXSCREENER_API_BASE=${DEXSCREENER_API_BASE:-https://api.dexscreener.com}
      # Fallback only; main supplies the risk/depth-capped quote amount.
      - SLIPPAGE_PROBE_USD=${SLIPPAGE_PROBE_USD:-500}
      - PRICE_DISAGREEMENT_WARN_PCT=${PRICE_DISAGREEMENT_WARN_PCT:-10}
      - PRICE_DISAGREEMENT_REJECT_PCT=${PRICE_DISAGREEMENT_REJECT_PCT:-100}
      # Per-trade notional is bounded by stressed stop loss as a share of
      # reference equity, then by depth and the hard notional cap.
      - REFERENCE_EQUITY_USD=${REFERENCE_EQUITY_USD:-1000}
      - MAX_TRADE_RISK_PERCENT=${MAX_TRADE_RISK_PERCENT:-0.5}
      - STRESSED_ROUND_TRIP_COST_PERCENT=${STRESSED_ROUND_TRIP_COST_PERCENT:-6.5}
      - MAX_POSITION_NOTIONAL_USD=${MAX_POSITION_NOTIONAL_USD:-1000}
      # Optional -- see .env.example. Without it, social_volume_score is a
      # labeled placeholder, not real data.
      - LUNARCRUSH_API_KEY=${LUNARCRUSH_API_KEY:-}
      # Market-data provider: "free" (default -- DexScreener + RugCheck +
      # Jupiter, no API key, includes rug/security signals), "dexscreener",
      # or "gmgn" (bot-blocked in practice). All are read-only: no signing
      # key, no wallet, no custody. See .env.example.
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-free}
      # Which holder-concentration measurement F_ATLAS gates on. Defaults
      # to 'provider' -- exactly the behaviour that has been running -- so
      # wiring holder_concentration.py in changes no verdict. Move it to
      # chain_wallet or chain_raw only against the calibration data, and
      # recheck the ceiling when you do: the ceiling is calibrated to one
      # definition and means nothing applied to another.
      - HOLDER_CONCENTRATION_SOURCE=${HOLDER_CONCENTRATION_SOURCE:-provider}
      - HOLDER_CONCENTRATION_OBSERVE=${HOLDER_CONCENTRATION_OBSERVE:-true}
      - TOP10_CONCENTRATION_CEILING_PERCENT=${TOP10_CONCENTRATION_CEILING_PERCENT:-30.0}
      - GMGN_API_KEY=${GMGN_API_KEY:-}
      - GMGN_HOT_SEARCH_INTERVAL=${GMGN_HOT_SEARCH_INTERVAL:-1h}
      - GMGN_HOT_SEARCH_CACHE_TTL_S=${GMGN_HOT_SEARCH_CACHE_TTL_S:-300}
      - GMGN_HOT_SEARCH_LIMIT=${GMGN_HOT_SEARCH_LIMIT:-500}
      # Birdeye (read-only market data) -- the primary discovery provider.
      # The real value lives ONLY in the project-root .env, which .gitignore
      # and .dockerignore both cover. It is named here because compose
      # forwards only what it names: omit this line and the key is invisible
      # inside the container, which looks identical to a rejected key.
      - BIRDEYE_API_KEY=${BIRDEYE_API_KEY:-}
      # Jupiter: the keyless primary discovery source. Birdeye's free tier
      # exhausts its compute-unit budget under a three-minute refresh and then
      # 400s every endpoint, so the liquidity-filtered sample cannot depend on
      # it. See token_discovery.py.
      - JUPITER_TOKENS_API_BASE=${JUPITER_TOKENS_API_BASE:-https://lite-api.jup.ag}
      - JUPITER_MIN_LIQUIDITY_USD=${JUPITER_MIN_LIQUIDITY_USD:-25000}
      # The separate, lower floor for newly listed tokens, and the hard
      # lower bound any user-set floor is clamped to. Both are read by
      # token_discovery, so both must be named here -- compose forwards
      # only what it lists, and a knob that silently keeps its code
      # default is a setting that appears to do nothing.
      - JUPITER_NEW_LISTING_MIN_LIQUIDITY_USD=${JUPITER_NEW_LISTING_MIN_LIQUIDITY_USD:-20000}
      - DISCOVERY_FLOOR_MIN_USD=${DISCOVERY_FLOOR_MIN_USD:-5000}
      # The holding pen. Capture has to keep up with the chain's launch
      # rate, not with the discovery refresh -- one page of new_pools spans
      # about two minutes, so a 60s sweep of two pages is ~4x redundancy.
      - PEN_CAPTURE_INTERVAL_S=${PEN_CAPTURE_INTERVAL_S:-60}
      - PEN_CAPTURE_PAGES=${PEN_CAPTURE_PAGES:-4}
      - PEN_BATCH_SIZE=${PEN_BATCH_SIZE:-30}
      - PEN_RETENTION_MINUTES=${PEN_RETENTION_MINUTES:-360}
      - DISCOVERY_FAILURE_RETRY_S=${DISCOVERY_FAILURE_RETRY_S:-30}
      # Knobs that were read by the code but never forwarded here. An
      # unlisted variable does not fail -- it silently keeps its code default,
      # so setting it in .env appeared to work and changed nothing. These
      # include the experiment's own parameters: the horizon set, the fill
      # window, and both abandonment clocks.
      - GECKOTERMINAL_API_BASE=${GECKOTERMINAL_API_BASE:-https://api.geckoterminal.com}
      - PEN_EXAMINE_AGE_MINUTES=${PEN_EXAMINE_AGE_MINUTES:-30}
      - JUPITER_PRICE_BASE=${JUPITER_PRICE_BASE:-https://api.jup.ag}
      - PRICE_DISAGREEMENT_WARN_PCT=${PRICE_DISAGREEMENT_WARN_PCT:-10}
      - RUGCHECK_API_BASE=${RUGCHECK_API_BASE:-https://api.rugcheck.xyz}
      - GMGN_API_BASE=${GMGN_API_BASE:-https://openapi.gmgn.ai}
      - GMGN_USER_AGENT=${GMGN_USER_AGENT:-memecoin-trading-agent/1.0}
      - PEN_SNAPSHOT_ATTEMPTS=${PEN_SNAPSHOT_ATTEMPTS:-3}
      - JUPITER_CACHE_TTL_S=${JUPITER_CACHE_TTL_S:-120}
      # Per-mint caches are swept of expired entries past this size.
      - CACHE_MAX_ENTRIES=${CACHE_MAX_ENTRIES:-5000}
      - LIMIT_FILL_WINDOW_MINUTES=${LIMIT_FILL_WINDOW_MINUTES:-60}
      - PAPER_FEE_PERCENT_PER_SIDE=${PAPER_FEE_PERCENT_PER_SIDE:-0.25}
      - PAPER_HORIZONS_MINUTES=${PAPER_HORIZONS_MINUTES:-30,60,120}
      - PAPER_HORIZON_TOLERANCE=${PAPER_HORIZON_TOLERANCE:-1.5}
      - PAPER_MAX_HOLD_MINUTES=${PAPER_MAX_HOLD_MINUTES:-360}
      - PAPER_REENTRY_COOLDOWN_MINUTES=${PAPER_REENTRY_COOLDOWN_MINUTES:-60}
      - PAPER_UNPRICEABLE_ABANDON_MINUTES=${PAPER_UNPRICEABLE_ABANDON_MINUTES:-180}
      # Bounded storage for operational tables (retention.py). The
      # experiment's own tables -- paper_trades, paper_horizon_returns --
      # are deliberately absent from this list and are never pruned.
      - RETENTION_ENABLED=${RETENTION_ENABLED:-true}
      - RETENTION_INTERVAL_S=${RETENTION_INTERVAL_S:-900}
      - RETENTION_BATCH=${RETENTION_BATCH:-5000}
      - ALERT_RETENTION_HOURS=${ALERT_RETENTION_HOURS:-72}
      - SEVERE_ALERT_RETENTION_HOURS=${SEVERE_ALERT_RETENTION_HOURS:-720}
      - AUDIT_RETENTION_HOURS=${AUDIT_RETENTION_HOURS:-336}
      - HOLDER_SAMPLE_RETENTION_HOURS=${HOLDER_SAMPLE_RETENTION_HOURS:-168}
      - PRICE_PATH_RETENTION_HOURS=${PRICE_PATH_RETENTION_HOURS:-336}
      # Ordered price path: resolution of the exit-policy replay.
      - PATH_SAMPLE_SECONDS=${PATH_SAMPLE_SECONDS:-30}
      - PATH_WINDOW_MINUTES=${PATH_WINDOW_MINUTES:-360}
      - HEALTH_MAX_TICK_AGE_S=${HEALTH_MAX_TICK_AGE_S:-600}
      # Exit-policy replay grid (replay_exits.py). The live 7.53/15.06 is
      # included on purpose so every cell has an anchor to compare against.
      - REPLAY_STOPS=${REPLAY_STOPS:-3,5,7.53,10,15,20}
      - REPLAY_TARGETS=${REPLAY_TARGETS:-3,5,7.5,10,15.06,25}
      # Include even one post-entry sample so quickly-stopped pricing is not
      # silently excluded from the replay population.
      - REPLAY_MIN_SAMPLES=${REPLAY_MIN_SAMPLES:-1}
      - JUPITER_MIN_AGE_MINUTES=${JUPITER_MIN_AGE_MINUTES:-15}
      - JUPITER_MAX_AGE_MINUTES=${JUPITER_MAX_AGE_MINUTES:-90}
      - JUPITER_MIN_INTERVAL_S=${JUPITER_MIN_INTERVAL_S:-1.1}
      - BIRDEYE_API_BASE=${BIRDEYE_API_BASE:-https://public-api.birdeye.so}
      # Triton One (read-only Solana RPC). NOT a discovery source -- it has no
      # trending or new-listing endpoint. It is the layer underneath the
      # aggregators: chain truth for the numbers the gates judge, and, via
      # Dragon's Mouth gRPC, sub-second new-pool detection if that is ever
      # built. Under evaluation only; see probe_triton.py.
      #
      # Triton issues either a URL with the token in the path or a hostname
      # plus an x-token header. Set whichever you were given.
      - TRITON_RPC_URL=${TRITON_RPC_URL:-}
      - TRITON_X_TOKEN=${TRITON_X_TOKEN:-}
      # --- Token discovery -------------------------------------------
      # Every value below matches the default compiled into
      # token_discovery.py, so leaving them unset changes nothing. They are
      # listed here because compose only forwards variables it names: without
      # these lines, setting one in .env has no effect inside the container
      # and the silence looks exactly like the knob not working.
      - ENABLE_TOKEN_DISCOVERY=${ENABLE_TOKEN_DISCOVERY:-true}
      - DISCOVERY_CACHE_TTL_S=${DISCOVERY_CACHE_TTL_S:-180}
      - DISCOVERY_MAX_CANDIDATES=${DISCOVERY_MAX_CANDIDATES:-300}
      # Birdeye is the primary discovery provider. min_liquidity is applied
      # SERVER-SIDE, and the recency window replaced the in-memory holding pen.
      - BIRDEYE_PAGE_LIMIT=${BIRDEYE_PAGE_LIMIT:-100}
      - BIRDEYE_MIN_LIQUIDITY_USD=${BIRDEYE_MIN_LIQUIDITY_USD:-25000}
      - BIRDEYE_MIN_AGE_MINUTES=${BIRDEYE_MIN_AGE_MINUTES:-15}
      - BIRDEYE_MAX_AGE_MINUTES=${BIRDEYE_MAX_AGE_MINUTES:-90}
      # Per-provider rate limits. Birdeye's 60/min is enforced per second;
      # GeckoTerminal is now one call per refresh, so 2.5s barely binds and is
      # insurance for the fallback pool walk.
      - BIRDEYE_MIN_INTERVAL_S=${BIRDEYE_MIN_INTERVAL_S:-1.1}
      - GECKOTERMINAL_MIN_INTERVAL_S=${GECKOTERMINAL_MIN_INTERVAL_S:-2.5}
      # GeckoTerminal pool walk -- FALLBACK ONLY, engages when Birdeye returns
      # nothing (missing key, exhausted quota, vendor outage).
      - DISCOVERY_POOL_PAGES=${DISCOVERY_POOL_PAGES:-4}
      - DISCOVERY_PAGE_SPACING_S=${DISCOVERY_PAGE_SPACING_S:-0.4}
      # Stage 3 (real signing -- see STAGE3_SETUP.md). "web" never gets any
      # Turnkey credentials -- only the internal URL of the separate
      # signer service, and an explicit, default-off switch to ever call
      # it. Flip this only after completing STAGE3_SETUP.md's devnet
      # smoke test yourself.
      - SIGNER_SERVICE_URL=${SIGNER_SERVICE_URL:-http://signer:8100}
      - ENABLE_STAGE3_EXECUTION=${ENABLE_STAGE3_EXECUTION:-false}
      # HMAC key authenticating web -> signer (signer_auth.py). The SAME value
      # must be in signer_service/.env. Empty is fine while Stage 3 is off;
      # with it on, an empty or short secret refuses every execution.
      - SIGNER_SHARED_SECRET=${SIGNER_SHARED_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Stage 3 (real signing -- see STAGE3_SETUP.md). A deliberately separate
  # service/container from "web": it is the only place Turnkey credentials
  # exist, and it independently re-validates every request against its own
  # database read before ever calling Turnkey (see signer_service/
  # policy_guard.py). Not started by a plain "docker compose up" -- it's
  # gated behind the "stage3" profile so it stays off by default at the
  # infrastructure level, not just the app-config level:
  #   docker compose --profile stage3 up -d --build
  # Its secrets live in signer_service/.env (a SEPARATE file from the
  # project root's .env) -- see signer_service/.env.example.
  signer:
    # Context is the repo ROOT, not signer_service/, so the image can include
    # tx_verify.py -- the same file the pipeline uses. A second copy inside
    # signer_service/ would be one more implementation of the transaction
    # wire format to keep in step, which is exactly the divergence this
    # codebase has been bitten by.
    build:
      context: .
      dockerfile: ./signer_service/Dockerfile
    container_name: trading_signer_service
    restart: unless-stopped
    profiles: ["stage3"]
    logging: *default-logging
    mem_limit: ${SIGNER_MEM_LIMIT:-512m}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The service holds the Turnkey key; its own code needs no writable
    # filesystem at all.
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ./signer_service/.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No "ports:" mapping on purpose -- this service is reachable only
    # from other containers on the compose network (i.e. "web"), never
    # from the host or the internet.

volumes:
  pgdata:
